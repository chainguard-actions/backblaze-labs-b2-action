name: Test credentials via environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      B2_APPLICATION_KEY_ID: fake-key-id-for-testing
      B2_APPLICATION_KEY: fake-key-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake credentials via env vars (expect failure)
        id: action
        uses: .
        with:
          action: list
          bucket: test-bucket
        continue-on-error: true

      - name: Assert action failed (fake credentials rejected by B2)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
