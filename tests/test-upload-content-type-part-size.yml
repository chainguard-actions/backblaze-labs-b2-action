name: Test upload with content-type and part-size inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run upload action with content-type and part-size (expect auth failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id-000000000001
          application-key: fake-key-0000000000000000000000000000000
          source: README.md
          destination: uploads/README.md
          content-type: text/plain
          part-size: '10485760'

      - name: Assert action failed (auth error expected)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when content-type and part-size are set"
