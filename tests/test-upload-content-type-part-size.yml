name: Test upload with content-type and part-size inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for upload" > /tmp/test-upload.txt

      - name: Run upload with content-type and part-size (expect failure on bad credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          source: /tmp/test-upload.txt
          destination: uploads/test-upload.txt
          content-type: text/plain
          part-size: '10485760'

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials when content-type and part-size were provided"
