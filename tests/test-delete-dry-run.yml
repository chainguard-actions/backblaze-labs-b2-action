name: Test delete dry-run with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: delete
          application-key-id: fake-key-id-00000000000000000000000000000000
          application-key: fake-key-0000000000000000000000000000000000000000
          bucket: fake-bucket
          source: path/to/file.txt
          dry-run: 'true'

      - name: Assert action ran (dry-run delete with invalid creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
