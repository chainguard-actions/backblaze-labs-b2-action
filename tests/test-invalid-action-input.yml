name: Test invalid action input validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: invalid-action-name
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key

      - name: Assert action failed with invalid action input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid action name"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid action name"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
