name: Test upload with content-type, part-size, and include inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          mkdir -p /tmp/upload-src
          echo "hello world" > /tmp/upload-src/hello.txt

      - name: Run upload with content-type, part-size, and include (expect failure - invalid creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000
          source: /tmp/upload-src/hello.txt
          destination: hello.txt
          content-type: text/plain
          part-size: '10485760'
          include: '*.txt'

      - name: Assert action failed (invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
