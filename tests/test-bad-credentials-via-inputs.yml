name: Test bad credentials via action inputs fail at B2 API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: nonexistent-test-bucket-for-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
      - name: Assert action failed due to bad B2 credentials from inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to bad B2 credentials from inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when bad B2 credentials were provided via action inputs"
