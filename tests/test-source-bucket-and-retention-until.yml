name: Test source-bucket and retention-until inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run copy action with source-bucket (expect auth failure)
        id: copy-action
        uses: .
        continue-on-error: true
        with:
          action: copy
          bucket: dest-bucket
          source-bucket: source-bucket
          application-key-id: fake-key-id-000000000001
          application-key: fake-key-0000000000000000000000000000000
          source: path/to/file.txt
          destination: path/to/copy.txt

      - name: Assert copy action failed (auth error expected)
        run: |
          echo "outcome: ${{ steps.copy-action.outcome }}"
          if [ "${{ steps.copy-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected copy action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: copy action correctly failed with invalid credentials when source-bucket is set"

      - name: Run retention action with retention-until (expect auth failure)
        id: retention-action
        uses: .
        continue-on-error: true
        with:
          action: retention
          bucket: test-bucket
          application-key-id: fake-key-id-000000000001
          application-key: fake-key-0000000000000000000000000000000
          source: path/to/file.txt
          retention-mode: governance
          retention-until: '2099-12-31T00:00:00Z'

      - name: Assert retention action failed (auth error expected)
        run: |
          echo "outcome: ${{ steps.retention-action.outcome }}"
          if [ "${{ steps.retention-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected retention action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: retention action correctly failed with invalid credentials when retention-until is set"
