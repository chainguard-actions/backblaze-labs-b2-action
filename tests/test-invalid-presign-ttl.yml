name: Test invalid presign-ttl validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: presign
          application-key-id: 'some-key-id'
          application-key: 'some-key'
          bucket: 'test-bucket'
          source: 'some/file.txt'
          presign-ttl: '-1'
      - name: Assert action failed with invalid presign-ttl
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with negative presign-ttl, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly rejected negative presign-ttl value"
