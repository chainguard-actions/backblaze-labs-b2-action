name: Test upload with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a file to upload
        run: |
          echo "test content" > /tmp/test-upload.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          application-key-id: fake-key-id-00000000000000000000000000000000
          application-key: fake-key-0000000000000000000000000000000000000000
          bucket: fake-bucket
          source: /tmp/test-upload.txt
          destination: test-upload.txt

      - name: Assert action failed with auth error (not skipped or crashed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with fake credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with outcome=$OUTCOME"
