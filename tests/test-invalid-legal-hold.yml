name: Test invalid legal-hold validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: retention
          application-key-id: 'some-key-id'
          application-key: 'some-key'
          bucket: 'test-bucket'
          source: 'some/file.txt'
          retention-mode: 'governance'
          retention-until: '2099-01-01T00:00:00Z'
          legal-hold: 'maybe'
      - name: Assert action failed with legal-hold validation error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid legal-hold, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid legal-hold value"
