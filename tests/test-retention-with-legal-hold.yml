name: Test retention with retention-mode, retention-until, and legal-hold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run retention with retention-mode, retention-until, and legal-hold (expect failure - invalid creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: retention
          bucket: test-bucket
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000
          source: some/file.txt
          retention-mode: governance
          retention-until: '2099-01-01T00:00:00Z'
          legal-hold: 'on'

      - name: Assert action failed (invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
