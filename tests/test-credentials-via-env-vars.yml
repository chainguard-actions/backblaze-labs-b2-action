name: Test credentials via environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      B2_APPLICATION_KEY_ID: fake-key-id-from-env
      B2_APPLICATION_KEY: fake-key-from-env
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: my-test-bucket
          # Credentials come from B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY env vars
      - name: Assert action failed at auth (not at input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the fake credentials are rejected by B2,
          # but it should NOT fail at input parsing (credentials were found via env vars).
          # Either way the step should fail (bad credentials → auth error).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid B2 credentials"
            exit 1
          fi
          echo "PASS: action correctly failed (credentials resolved from env vars, then rejected by B2)"
