name: Test upload with advanced inputs (content-type, part-size, include, sse)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy file to upload
        run: |
          mkdir -p /tmp/upload-src
          echo "hello world" > /tmp/upload-src/hello.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          application-key-id: invalid-key-id
          application-key: invalid-key
          bucket: test-bucket
          source: /tmp/upload-src/hello.txt
          destination: hello.txt
          content-type: text/plain
          part-size: '10485760'
          include: '*.txt'
          sse: B2
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
