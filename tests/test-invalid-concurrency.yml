name: Test invalid concurrency integer error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: fake-key-id
          B2_APPLICATION_KEY: fake-key
        with:
          action: upload
          bucket: my-test-bucket
          source: ./some-file.txt
          destination: remote/some-file.txt
          concurrency: not-a-number
      - name: Assert action failed due to invalid concurrency value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid concurrency, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when an invalid concurrency value was provided"
