name: Test invalid concurrency input validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: some-file.txt
          destination: remote/some-file.txt
          concurrency: '0'

      - name: Assert action failed with invalid concurrency
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid concurrency=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with concurrency=0 (must be positive)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
