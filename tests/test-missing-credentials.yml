name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: 'test-bucket'
        # Intentionally omit application-key-id and application-key
        # and ensure the env vars are not set either
        env:
          B2_APPLICATION_KEY_ID: ''
          B2_APPLICATION_KEY: ''
      - name: Assert action failed due to missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing credentials, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials are missing"
