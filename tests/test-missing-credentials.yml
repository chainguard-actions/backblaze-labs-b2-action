name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: my-test-bucket
          # No application-key-id or application-key provided
          # No B2_APPLICATION_KEY_ID or B2_APPLICATION_KEY env vars set
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with missing credentials"
