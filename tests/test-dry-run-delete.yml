name: Test dry-run delete mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run delete action in dry-run mode with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: delete
          bucket: test-bucket
          source: some/path/to/file.txt
          dry-run: 'true'
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000

      - name: Assert action failed (auth error expected with invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials in dry-run mode"
