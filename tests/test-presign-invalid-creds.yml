name: Test presign action with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run presign action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: presign
          bucket: test-bucket
          source: path/to/file.txt
          presign-ttl: '7200'
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected presign action to fail when invalid credentials are provided"
            exit 1
          fi
          echo "PASS: presign action correctly failed with invalid credentials"

      - name: Assert presigned-url output is empty on failure
        env:
          PRESIGNED_URL: ${{ steps.action.outputs.presigned-url }}
        run: |
          echo "presigned-url: '$PRESIGNED_URL'"
          if [ -n "$PRESIGNED_URL" ]; then
            echo "FAIL: expected presigned-url to be empty on auth failure"
            exit 1
          fi
          echo "PASS: presigned-url is correctly empty on failure"
