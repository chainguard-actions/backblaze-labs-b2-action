name: Test upload with include glob filter input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test files for include glob test
        run: |
          mkdir -p /tmp/include-test
          echo "text file" > /tmp/include-test/file.txt
          echo "log file" > /tmp/include-test/file.log
          echo "json file" > /tmp/include-test/data.json

      - name: Run upload with include glob (expect failure on bad credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          source: /tmp/include-test/
          destination: uploads/
          include: '*.txt,*.json'

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials when include glob was provided"
