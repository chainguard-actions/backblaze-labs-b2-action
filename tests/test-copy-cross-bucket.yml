name: Test copy action with source-bucket and endpoint options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run copy with source-bucket and endpoint options (expect failure on auth)
        id: copy-cross-bucket
        uses: .
        with:
          action: copy
          bucket: dest-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: path/to/source-file.txt
          destination: path/to/dest-file.txt
          source-bucket: source-bucket
          endpoint: 'https://s3.us-west-004.backblazeb2.com'
        continue-on-error: true

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.copy-cross-bucket.outcome }}"
          if [ "${{ steps.copy-cross-bucket.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (source-bucket and endpoint inputs accepted)"
