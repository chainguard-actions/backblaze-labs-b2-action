name: Test sync action dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local directory for sync source
        run: |
          mkdir -p /tmp/sync-source
          echo "hello world" > /tmp/sync-source/hello.txt
          echo "another file" > /tmp/sync-source/another.txt

      - name: Run sync action in dry-run mode with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: sync
          bucket: test-bucket
          source: /tmp/sync-source
          destination: backup/
          direction: up
          compare-mode: modtime
          keep-mode: no-delete
          dry-run: 'true'
          concurrency: '2'
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000

      - name: Assert action failed (auth error expected with invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected sync action to fail when invalid credentials are provided"
            exit 1
          fi
          echo "PASS: sync action correctly failed with invalid credentials"
