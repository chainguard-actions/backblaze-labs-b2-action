name: Test verify action with expected-sha1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run verify action with expected-sha1 (expect auth failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: verify
          bucket: test-bucket
          application-key-id: fake-key-id-000000000001
          application-key: fake-key-0000000000000000000000000000000
          source: uploads/README.md
          destination: README.md
          expected-sha1: 'da39a3ee5e6b4b0d3255bfef95601890afd80709'

      - name: Assert action failed (auth error expected)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when expected-sha1 is set"
