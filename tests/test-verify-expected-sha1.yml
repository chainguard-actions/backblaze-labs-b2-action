name: Test verify action with expected-sha1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a local file for verify
        run: |
          echo "test content" > /tmp/local-verify-file.txt

      - name: Run verify action with expected-sha1 (expect failure on bad credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: verify
          bucket: test-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          source: remote/path/test-file.txt
          destination: /tmp/local-verify-file.txt
          expected-sha1: 'da39a3ee5e6b4b0d3255bfef95601890afd80709'

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials when expected-sha1 was provided"
