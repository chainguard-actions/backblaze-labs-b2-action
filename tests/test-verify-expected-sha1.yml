name: Test verify with expected-sha1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy local file for verify
        run: |
          echo "hello world" > /tmp/local-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: verify
          application-key-id: invalid-key-id
          application-key: invalid-key
          bucket: test-bucket
          source: path/to/remote-file.txt
          destination: /tmp/local-file.txt
          expected-sha1: 'aabbccdd1122334455667788aabbccdd11223344'
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
