name: Test list with custom endpoint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run list with custom endpoint (expect failure - invalid creds/endpoint)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: test-bucket
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000
          endpoint: https://invalid-endpoint.example.com

      - name: Assert action failed (invalid credentials or endpoint)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials/endpoint"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials/endpoint"
