name: Test zero concurrency is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          concurrency: '0'
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail because concurrency=0 is not a positive integer"
            exit 1
          fi
          echo "PASS: action correctly rejected zero concurrency"
