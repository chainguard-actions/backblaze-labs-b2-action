name: Test invalid boolean input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: delete
          application-key-id: 'some-key-id'
          application-key: 'some-key'
          bucket: 'test-bucket'
          source: 'some/file.txt'
          dry-run: 'maybe'
      - name: Assert action failed with boolean validation error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid dry-run boolean, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid boolean value for dry-run"
