name: Test bad credentials via env vars fail at B2 API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: 000000000000000000000001
          B2_APPLICATION_KEY: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
        with:
          action: list
          bucket: nonexistent-test-bucket-for-ci
      - name: Assert action failed due to bad B2 credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to bad B2 credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when bad B2 credentials were provided via env vars"
