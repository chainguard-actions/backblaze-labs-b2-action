name: Test invalid compare-mode validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: sync
          application-key-id: 'some-key-id'
          application-key: 'some-key'
          bucket: 'test-bucket'
          source: '/tmp/local-dir'
          destination: 'remote/prefix/'
          compare-mode: 'invalid-mode'
      - name: Assert action failed with compare-mode validation error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid compare-mode, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid compare-mode value"
