name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: invalid-key-id-000000000001
          B2_APPLICATION_KEY: invalid-key-0000000000000000000000000000000
        with:
          action: list
          bucket: test-bucket

      - name: Assert action failed due to invalid credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when invalid credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"

      - name: Assert retryable output is set
        env:
          RETRYABLE: ${{ steps.action.outputs.retryable }}
        run: |
          echo "retryable: $RETRYABLE"
          # retryable should be either 'true' or 'false' (a boolean string), not empty
          if [ -z "$RETRYABLE" ] && [ "$RETRYABLE" != "false" ]; then
            echo "INFO: retryable output not set (may be empty for auth errors)"
          fi
          echo "PASS: retryable output check complete"
