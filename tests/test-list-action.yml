name: Test list action with env var credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        with:
          action: list
          bucket: ${{ secrets.B2_BUCKET || 'test-bucket' }}
          max-results: '10'

      - name: Assert action ran (succeeded with real creds, or failed gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES_LISTED: ${{ steps.action.outputs.files-listed }}
          FILE_COUNT: ${{ steps.action.outputs.file-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files-listed: $FILES_LISTED"
          echo "file-count: $FILE_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FILES_LISTED" ]; then
              echo "FAIL: action succeeded but files-listed output is empty"
              exit 1
            fi
            echo "PASS: list succeeded, files-listed=$FILES_LISTED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real B2 credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
