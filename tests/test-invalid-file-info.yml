name: Test invalid file-info metadata validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: /tmp/test.txt
          destination: test/test.txt
          # b2- prefix is reserved and should be rejected
          file-info: 'b2-reserved-key=some-value'

      - name: Assert action failed with invalid file-info key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with reserved b2- file-info key"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with reserved b2- file-info key"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
