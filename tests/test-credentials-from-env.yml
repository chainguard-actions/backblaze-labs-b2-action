name: Test credentials resolved from environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: 'test-bucket'
          # No application-key-id or application-key inputs — rely on env vars
        env:
          B2_APPLICATION_KEY_ID: 'env-key-id-invalid'
          B2_APPLICATION_KEY: 'env-key-invalid'
      - name: Assert action failed at API level (not at credential-missing level)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the credentials are invalid (API error),
          # NOT because credentials are missing. Either way the step fails, which
          # confirms the env var credential path was reached.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid env-var credentials, but outcome was '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly picked up credentials from env vars and failed at API level"
