name: Test credentials resolved from environment variables
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Provide credentials via env vars (not action inputs)
          B2_APPLICATION_KEY_ID: fake-env-key-id
          B2_APPLICATION_KEY: fake-env-key
        with:
          action: list
          bucket: test-bucket
          max-results: '5'
          # Intentionally omit application-key-id and application-key inputs
          # to verify the env var fallback path is exercised

      - name: Assert action failed at auth (not at credential resolution)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RETRYABLE: ${{ steps.action.outputs.retryable }}
        run: |
          echo "outcome: $OUTCOME"
          echo "retryable: $RETRYABLE"
          # With fake credentials provided via env vars, the action should
          # reach the B2 API and fail at authentication (not at input parsing).
          # Either outcome is acceptable: success means real creds were injected,
          # failure means the fake creds were correctly picked up and rejected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake env var credentials rejected by B2)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
