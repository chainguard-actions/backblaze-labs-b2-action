name: Test expected-sha1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: verify
          application-key-id: invalid-key-id
          application-key: invalid-key
          bucket: test-bucket
          source: remote/file.txt
          destination: /tmp/local-file.txt
          expected-sha1: da39a3ee5e6b4b0d3255bfef95601890afd80709
      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
