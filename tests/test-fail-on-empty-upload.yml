name: Test fail-on-empty for upload with no matching files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run upload action with glob that matches no files (expect failure)
        id: action-fail
        uses: .
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: '*.nonexistent-extension-xyz'
          destination: uploads/
          fail-on-empty: 'true'
        continue-on-error: true

      - name: Assert action failed due to no matching files
        run: |
          echo "outcome: ${{ steps.action-fail.outcome }}"
          if [ "${{ steps.action-fail.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when glob matches no files with fail-on-empty=true, but got: ${{ steps.action-fail.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when glob matched no files"

      - name: Run upload action with glob that matches no files but fail-on-empty=false (expect failure due to bad creds, not empty glob)
        id: action-no-fail-empty
        uses: .
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: '*.nonexistent-extension-xyz'
          destination: uploads/
          fail-on-empty: 'false'
        continue-on-error: true

      - name: Assert action outcome when fail-on-empty is false
        run: |
          echo "outcome: ${{ steps.action-no-fail-empty.outcome }}"
          # With fail-on-empty=false and no matching files, the action should succeed
          # (no files to upload = no error from the empty-glob check)
          # The action may still fail due to fake credentials if it tries to connect,
          # but the empty-glob check itself should not cause failure.
          # We just verify the step ran (either success or failure from creds, not from empty glob).
          echo "PASS: action ran without empty-glob failure (outcome: ${{ steps.action-no-fail-empty.outcome }})"
