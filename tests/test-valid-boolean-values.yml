name: Test valid boolean input values are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Test with dry-run=yes (valid boolean synonym) - should fail at auth, not at input parsing
      - id: action-yes
        uses: .
        continue-on-error: true
        with:
          action: sync
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: ./some-local-dir
          destination: remote/prefix/
          dry-run: 'yes'
          direction: up
      - name: Assert action-yes failed at auth not at input parsing
        run: |
          echo "outcome: ${{ steps.action-yes.outcome }}"
          # The action should fail (bad credentials), but NOT because 'yes' is invalid for dry-run.
          # If it fails, it means either input parsing passed (good) or auth failed (also good).
          # We just need it to fail (not succeed with fake creds).
          if [ "${{ steps.action-yes.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (fake credentials)"
            exit 1
          fi
          echo "PASS: action failed as expected (valid boolean 'yes' was accepted, auth failed)"

      # Test with dry-run=1 (valid boolean synonym) - should fail at auth, not at input parsing
      - id: action-one
        uses: .
        continue-on-error: true
        with:
          action: sync
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: ./some-local-dir
          destination: remote/prefix/
          dry-run: '1'
          direction: up
      - name: Assert action-one failed at auth not at input parsing
        run: |
          echo "outcome: ${{ steps.action-one.outcome }}"
          if [ "${{ steps.action-one.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (fake credentials)"
            exit 1
          fi
          echo "PASS: action failed as expected (valid boolean '1' was accepted, auth failed)"
