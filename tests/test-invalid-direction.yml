name: Test invalid direction enum error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: fake-key-id
          B2_APPLICATION_KEY: fake-key
        with:
          action: sync
          bucket: my-test-bucket
          source: ./local-dir
          destination: remote/prefix/
          direction: sideways
      - name: Assert action failed due to invalid direction
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid direction, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when an invalid direction was provided"
