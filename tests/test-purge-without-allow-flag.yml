name: Test purge action requires allow-bucket-purge flag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: purge
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          # Omit source to trigger whole-bucket purge path
          # allow-bucket-purge defaults to false, so this should fail
          allow-bucket-purge: 'false'

      - name: Assert action failed without allow-bucket-purge
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without allow-bucket-purge=true"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without allow-bucket-purge=true"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
