name: Test upload action basic path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file to upload
        run: |
          echo "test content for b2 upload" > /tmp/test-upload.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: /tmp/test-upload.txt
          destination: test/test-upload.txt
          content-type: text/plain

      - name: Assert action ran (succeeded with real creds, or failed gracefully without)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILE_ID: ${{ steps.action.outputs.file-id }}
          FILE_NAME: ${{ steps.action.outputs.file-name }}
          FILES_UPLOADED: ${{ steps.action.outputs.files-uploaded }}
          BYTES_TRANSFERRED: ${{ steps.action.outputs.bytes-transferred }}
        run: |
          echo "outcome: $OUTCOME"
          echo "file-id: $FILE_ID"
          echo "file-name: $FILE_NAME"
          echo "files-uploaded: $FILES_UPLOADED"
          echo "bytes-transferred: $BYTES_TRANSFERRED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FILE_ID" ] || [ -z "$FILE_NAME" ]; then
              echo "FAIL: action succeeded but file-id or file-name output is empty"
              exit 1
            fi
            if [ "$FILES_UPLOADED" != "1" ]; then
              echo "FAIL: expected files-uploaded=1, got '$FILES_UPLOADED'"
              exit 1
            fi
            echo "PASS: upload succeeded, file-id=$FILE_ID, file-name=$FILE_NAME"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake credentials rejected by B2)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
