name: Test auth failure produces retryable output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
      - name: Assert retryable output is set to false for auth failure
        env:
          RETRYABLE: ${{ steps.action.outputs.retryable }}
        run: |
          echo "retryable: $RETRYABLE"
          # Auth failures (BadAuthTokenError) are classified as non-retryable (retryable=false)
          # The output should be 'false' for authentication failures
          if [ "$RETRYABLE" = "true" ]; then
            echo "FAIL: auth failure should not be retryable"
            exit 1
          fi
          echo "PASS: retryable is not 'true' for auth failure (value: '$RETRYABLE')"
