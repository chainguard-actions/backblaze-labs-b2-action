name: Test purge without allow-bucket-purge flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: purge
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          # No source provided, allow-bucket-purge defaults to false
          # This should fail at input validation or auth stage
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (purge without source or allow-bucket-purge)"
            exit 1
          fi
          echo "PASS: action correctly failed for purge without source or allow-bucket-purge"
