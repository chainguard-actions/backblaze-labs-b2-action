name: Test upload with server-side encryption (sse) input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file for SSE upload
        run: |
          echo "sensitive content" > /tmp/sse-test-file.txt

      - name: Run upload with SSE-B2 encryption (expect failure on bad credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          source: /tmp/sse-test-file.txt
          destination: uploads/sse-test-file.txt
          sse: 'B2'

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials when sse=B2 was provided"
