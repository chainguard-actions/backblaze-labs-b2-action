name: Test all valid action verbs are recognized
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test 'list' verb - should fail at auth, not at verb validation
      - id: list-action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
      - name: Assert list verb recognized
        run: |
          echo "outcome: ${{ steps.list-action.outcome }}"
          if [ "${{ steps.list-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected failure (fake credentials), got success"
            exit 1
          fi
          echo "PASS: list verb recognized (failed at auth as expected)"

      # Test 'upload' verb - should fail at auth, not at verb validation
      - id: upload-action
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: some-file.txt
          destination: remote/some-file.txt
      - name: Assert upload verb recognized
        run: |
          echo "outcome: ${{ steps.upload-action.outcome }}"
          if [ "${{ steps.upload-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected failure (fake credentials), got success"
            exit 1
          fi
          echo "PASS: upload verb recognized (failed at auth as expected)"

      # Test 'download' verb - should fail at auth, not at verb validation
      - id: download-action
        uses: .
        continue-on-error: true
        with:
          action: download
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: remote/some-file.txt
          destination: /tmp/downloaded-file.txt
      - name: Assert download verb recognized
        run: |
          echo "outcome: ${{ steps.download-action.outcome }}"
          if [ "${{ steps.download-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected failure (fake credentials), got success"
            exit 1
          fi
          echo "PASS: download verb recognized (failed at auth as expected)"

      # Test 'delete' verb - should fail at auth, not at verb validation
      - id: delete-action
        uses: .
        continue-on-error: true
        with:
          action: delete
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: remote/some-file.txt
      - name: Assert delete verb recognized
        run: |
          echo "outcome: ${{ steps.delete-action.outcome }}"
          if [ "${{ steps.delete-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected failure (fake credentials), got success"
            exit 1
          fi
          echo "PASS: delete verb recognized (failed at auth as expected)"

      # Test 'head' verb - should fail at auth, not at verb validation
      - id: head-action
        uses: .
        continue-on-error: true
        with:
          action: head
          bucket: my-test-bucket
          application-key-id: fake-key-id
          application-key: fake-key
          source: remote/some-file.txt
      - name: Assert head verb recognized
        run: |
          echo "outcome: ${{ steps.head-action.outcome }}"
          if [ "${{ steps.head-action.outcome }}" != "failure" ]; then
            echo "FAIL: expected failure (fake credentials), got success"
            exit 1
          fi
          echo "PASS: head verb recognized (failed at auth as expected)"
