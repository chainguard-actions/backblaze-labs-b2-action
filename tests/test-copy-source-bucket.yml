name: Test copy action with source-bucket input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run copy action with source-bucket (expect failure on bad credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: copy
          bucket: dest-bucket-ci
          source-bucket: source-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          source: path/to/source-file.txt
          destination: path/to/dest-file.txt

      - name: Assert action failed due to bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with bad credentials when source-bucket was provided"
