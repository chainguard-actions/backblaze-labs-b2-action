name: Test verify with expected-sha1 input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a local file for verify
        run: |
          echo "hello world" > /tmp/local-verify.txt

      - name: Run verify with expected-sha1 (expect failure - invalid creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: verify
          bucket: test-bucket
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000
          source: some/remote-file.txt
          destination: /tmp/local-verify.txt
          expected-sha1: 22596363b3de40b06f981fb85d82312e8c0ed511

      - name: Assert action failed (invalid credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
