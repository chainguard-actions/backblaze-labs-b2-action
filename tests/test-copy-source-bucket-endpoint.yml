name: Test copy with source-bucket and endpoint inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: copy
          application-key-id: invalid-key-id
          application-key: invalid-key
          bucket: dest-bucket
          source-bucket: source-bucket
          source: path/to/source-file.txt
          destination: path/to/dest-file.txt
          endpoint: 'https://s3.us-west-004.backblazeb2.com'
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
