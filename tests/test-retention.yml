name: Test retention with legal-hold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: retention
          bucket: test-bucket
          source: some/file.txt
          retention-mode: governance
          retention-until: "2099-01-01T00:00:00Z"
          legal-hold: "on"
          bypass-governance: "false"
          application-key-id: fake-key-id
          application-key: fake-key
      - name: Assert action ran (fails gracefully without valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
