name: Test retention with retention-mode, retention-until, legal-hold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: retention
          application-key-id: invalid-key-id
          application-key: invalid-key
          bucket: test-bucket
          source: path/to/file.txt
          retention-mode: governance
          retention-until: '2099-12-31T23:59:59Z'
          legal-hold: 'on'
          bypass-governance: 'false'
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
