name: Test upload fail-on-empty behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a temp directory with no matching files
        run: |
          mkdir -p /tmp/upload-test-empty
          echo "this is a text file" > /tmp/upload-test-empty/file.txt

      - name: Run upload with glob that matches nothing and fail-on-empty true (expect failure)
        id: action-fail
        uses: .
        continue-on-error: true
        with:
          action: upload
          bucket: test-bucket
          source: /tmp/upload-test-empty/*.nonexistent
          destination: test-prefix/
          fail-on-empty: 'true'
          application-key-id: invalid-key-id-000000000001
          application-key: invalid-key-0000000000000000000000000000000

      - name: Assert action failed when glob matches no files
        run: |
          echo "outcome: ${{ steps.action-fail.outcome }}"
          if [ "${{ steps.action-fail.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when glob matches no files and fail-on-empty is true"
            exit 1
          fi
          echo "PASS: action correctly failed when glob matched no files"
