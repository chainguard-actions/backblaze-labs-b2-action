name: Test endpoint override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run list action with endpoint override (expect failure on bad credentials or endpoint)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: test-bucket-ci
          application-key-id: 000000000000000000000001
          application-key: K000aaaBBBcccDDDeeeFFFgggHHHiiiJ
          endpoint: 'https://s3.us-west-004.backblazeb2.com'

      - name: Assert action failed due to bad credentials or endpoint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials/endpoint, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when endpoint override was provided with bad credentials"
