name: Test endpoint override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom endpoint (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: test-bucket
          application-key-id: fake-key-id-000000000001
          application-key: fake-key-0000000000000000000000000000000
          endpoint: 'https://s3.us-west-004.backblazeb2.com'

      - name: Assert action failed (auth or endpoint error expected)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials and custom endpoint"
            exit 1
          fi
          echo "PASS: action correctly failed when endpoint override is set with invalid credentials"
