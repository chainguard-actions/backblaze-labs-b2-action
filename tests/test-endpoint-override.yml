name: Test endpoint override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: list
          bucket: test-bucket
          source: some/prefix/
          endpoint: "https://s3.us-west-004.backblazeb2.com"
          application-key-id: fake-key-id
          application-key: fake-key
      - name: Assert action ran (fails gracefully without valid credentials or endpoint)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials/endpoint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
